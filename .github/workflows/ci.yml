name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP lint (CCD)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: php -l on mu-plugins and ccd-backup
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src php:8.3-cli bash -lc '
            fail=0
            while IFS= read -r -d "" f; do
              echo "==> $f"
              php -l "$f" || fail=1
            done < <(find wordpress/wp-content/mu-plugins wordpress/wp-content/plugins/ccd-backup \
              -type f -name "*.php" -print0 2>/dev/null)
            exit "$fail"
          '

  unit:
    name: PHPUnit (mu-plugin helpers)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Composer install + PHPUnit
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/phpunit --colors=always

  build:
    name: Build + smoke + integration
    runs-on: ubuntu-24.04
    needs: [lint, unit]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Setup Node (Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: convivendocomdiabetes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke /ccdhealth (Apache Alias, sem DB)
        run: |
          set -euo pipefail
          docker rm -f ccd-ci-smoke >/dev/null 2>&1 || true
          # Entrypoint de prod exige DB; Apache sozinho basta para /ccdhealth.
          docker run -d --name ccd-ci-smoke -p 18080:80 \
            --entrypoint apache2-foreground \
            convivendocomdiabetes:ci
          cleanup() { docker rm -f ccd-ci-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/ccdhealth.body -w '%{http_code}' \
              --max-time 3 http://127.0.0.1:18080/ccdhealth || echo 000)
            if [ "$code" = "200" ]; then
              body=$(tr -d '\r' </tmp/ccdhealth.body | head -c 64)
              echo "GET /ccdhealth => $code body=${body}"
              echo "$body" | grep -qi 'ok'
              ok=1
              break
            fi
            echo "attempt $i: HTTP $code"
            sleep 1
          done
          [ "$ok" = "1" ]

          # Nao deve ser redirect (Railway nao segue 301).
          loc=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 3 \
            http://127.0.0.1:18080/ccdhealth || true)
          if [ -n "$loc" ]; then
            echo "FAIL: /ccdhealth redirecionou para $loc"
            exit 1
          fi

      - name: Integration MySQL+Redis+SEO+UX+E2E
        run: |
          set -euo pipefail
          chmod +x scripts/ci-integration-mysql.sh scripts/ci-seed-content.sh \
            scripts/ci-seo-stampede-smoke.sh scripts/ci-seo-smoke.sh scripts/ci-ux-smoke.sh
          ./scripts/ci-integration-mysql.sh

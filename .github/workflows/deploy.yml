name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy db + wordpress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          missing=0
          for s in RAILWAY_API_TOKEN RAILWAY_PROJECT_ID MYSQL_PASSWORD MYSQL_ROOT_PASSWORD; do
            if [ -z "${!s}" ]; then
              echo "::error::Secret $s nao configurado"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "IMPORTANTE: use RAILWAY_API_TOKEN (Account token), NAO RAILWAY_TOKEN (Project token)."
            echo "Crie em https://railway.app/account/tokens sem selecionar workspace."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Provision + deploy
        env:
          # Nao defina RAILWAY_TOKEN aqui — ele sobrescreve o API token e quebra o CI
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          unset RAILWAY_TOKEN || true
          chmod +x scripts/ci-deploy-railway.sh
          ./scripts/ci-deploy-railway.sh

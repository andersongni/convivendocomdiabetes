# Deploy no Railway NAO usa mais token/CLI.
# O projeto ja esta conectado ao GitHub com Auto-deploys.
# Este workflow so valida o build Docker antes do Railway subir
# (ative "Wait for CI" no servico wordpress no Railway).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build WordPress image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: convivendocomdiabetes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MySQL image (dump)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mysql
          push: false
          tags: convivendocomdiabetes-mysql:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

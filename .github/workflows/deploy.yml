name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy db + wordpress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          missing=0
          for s in RAILWAY_TOKEN MYSQL_PASSWORD MYSQL_ROOT_PASSWORD; do
            if [ -z "${!s}" ]; then
              echo "::error::Secret $s nao configurado"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Use PROJECT TOKEN do projeto Railway (Settings do projeto -> Tokens)."
            echo "Nao use Account Tokens (railway.app/account/tokens)."
            echo "Setup local uma vez: powershell -File scripts/setup-railway-once.ps1"
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          unset RAILWAY_API_TOKEN || true
          chmod +x scripts/ci-deploy-railway.sh
          ./scripts/ci-deploy-railway.sh

name: Smoke production

# Nao usar on.push nem workflow_run no mesmo commit do CI: Wait for CI no Railway
# espera check suites daquele SHA — smoke pos-deploy no mesmo commit = deadlock.
#
# Triggers seguros:
# - schedule / workflow_dispatch
# - repository_dispatch (Railway webhook apos Deployment.deployed — ver docs/CI.md)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [railway-deploy]

permissions:
  contents: read

concurrency:
  group: smoke-prod
  cancel-in-progress: true

jobs:
  smoke:
    name: apex health + www 301
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Smoke production
        run: |
          set -euo pipefail
          chmod +x scripts/smoke-prod.sh
          ./scripts/smoke-prod.sh

name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - "railway.toml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - "railway.toml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Rodar terraform apply (exige state remoto ja importado)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-railway
  cancel-in-progress: false

jobs:
  validate:
    name: Fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Skip without token
        id: gate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN ausente — plan ignorado (ok ate configurar o secret)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform init
        if: steps.gate.outputs.skip == 'false'
        run: terraform init -input=false

      - name: Terraform plan
        if: steps.gate.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          TF_VAR_wp_admin_password: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          terraform plan -input=false -no-color \
            -var="wp_admin_password=${TF_VAR_wp_admin_password}"

  apply:
    name: Apply
    needs: plan
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.apply == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: railway
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          TF_VAR_wp_admin_password: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          terraform apply -input=false -auto-approve \
            -var="wp_admin_password=${TF_VAR_wp_admin_password}"

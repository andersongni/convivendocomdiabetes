name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - ".railway/**"
      - "scripts/terraform-import.sh"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - ".railway/**"
      - "scripts/terraform-import.sh"
  workflow_dispatch:
    inputs:
      import:
        description: "Importar recursos Railway existentes para o state (uma vez)"
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
      run_apply:
        description: "Aplicar mudancas de infra no Railway (escolha yes)"
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: write

concurrency:
  group: terraform-railway
  cancel-in-progress: false

env:
  TF_VERSION: 1.9.8
  TF_STATE_BRANCH: tfstate

jobs:
  validate:
    name: Fmt and validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Show dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "import=${{ inputs.import }}"
          echo "run_apply=${{ inputs.run_apply }}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  import:
    name: Import existing Railway
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.import == 'yes' }}
    runs-on: ubuntu-24.04
    environment: railway
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve Railway token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          TOKEN="${RAILWAY_TOKEN:-$RAILWAY_API_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "Defina o secret RAILWAY_TOKEN ou RAILWAY_API_TOKEN."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "RAILWAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Load Terraform state from branch
        run: |
          git fetch origin "$TF_STATE_BRANCH:$TF_STATE_BRANCH" 2>/dev/null || true
          if git show "$TF_STATE_BRANCH:terraform.tfstate" >/dev/null 2>&1; then
            git show "$TF_STATE_BRANCH:terraform.tfstate" > terraform/terraform.tfstate
            echo "State carregado da branch $TF_STATE_BRANCH"
          else
            echo "Nenhum state ainda — import vai criar um novo."
          fi

      - name: Import
        env:
          TF_VAR_wp_admin_password: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          chmod +x scripts/terraform-import.sh
          if [ -z "${TF_VAR_wp_admin_password:-}" ]; then
            export TF_VAR_wp_admin_password="CcdTrocar123!"
          fi
          ./scripts/terraform-import.sh

      - name: Save Terraform state to branch
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          git worktree add -B "$TF_STATE_BRANCH" "$TMP" "origin/$TF_STATE_BRANCH" 2>/dev/null \
            || git worktree add -B "$TF_STATE_BRANCH" "$TMP"
          cp terraform/terraform.tfstate "$TMP/terraform.tfstate"
          if [ -f terraform/terraform.tfstate.backup ]; then
            cp terraform/terraform.tfstate.backup "$TMP/terraform.tfstate.backup"
          fi
          cd "$TMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terraform.tfstate terraform.tfstate.backup 2>/dev/null || git add terraform.tfstate
          if git diff --cached --quiet; then
            echo "State sem alteracoes."
          else
            git commit -m "chore(tfstate): import Railway resources"
            git push origin "HEAD:$TF_STATE_BRANCH"
          fi

  plan_and_apply:
    name: Plan and apply
    needs: [validate, import]
    if: always() && needs.validate.result == 'success' && (needs.import.result == 'success' || needs.import.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: railway
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve Railway token
        id: gate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          TOKEN="${RAILWAY_TOKEN:-$RAILWAY_API_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "Token ausente — plan ignorado."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$TOKEN"
          echo "RAILWAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Load Terraform state from branch
        id: state
        if: steps.gate.outputs.skip == 'false'
        working-directory: .
        run: |
          git fetch origin "$TF_STATE_BRANCH:$TF_STATE_BRANCH" 2>/dev/null || true
          if git show "$TF_STATE_BRANCH:terraform.tfstate" >/dev/null 2>&1; then
            git show "$TF_STATE_BRANCH:terraform.tfstate" > terraform/terraform.tfstate
            echo "State carregado."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Sem state na branch $TF_STATE_BRANCH."
            echo "Rode Actions → Terraform → Run workflow com import=yes uma vez."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform init
        if: steps.gate.outputs.skip == 'false' && steps.state.outputs.skip != 'true'
        run: terraform init -input=false

      - name: Drop stale service domain from state
        id: prune
        if: steps.gate.outputs.skip == 'false' && steps.state.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if terraform state show railway_service_domain.wordpress >/dev/null 2>&1; then
            terraform state rm railway_service_domain.wordpress
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Removido railway_service_domain.wordpress do state (recurso obsoleto)."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform plan
        if: steps.gate.outputs.skip == 'false' && steps.state.outputs.skip != 'true'
        env:
          TF_VAR_wp_admin_password: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          PASSWORD="${TF_VAR_wp_admin_password:-CcdTrocar123!}"
          terraform plan -input=false -no-color -var="wp_admin_password=$PASSWORD"

      - name: Terraform apply
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.run_apply == 'yes' &&
          github.ref == 'refs/heads/main' &&
          steps.gate.outputs.skip == 'false' &&
          steps.state.outputs.skip != 'true'
        env:
          TF_VAR_wp_admin_password: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          PASSWORD="${TF_VAR_wp_admin_password:-CcdTrocar123!}"
          # Evita drifts de volume/serviço; aplica só as variáveis gerenciadas.
          terraform apply -input=false -auto-approve \
            -target=railway_variable.wordpress_db_host \
            -target=railway_variable.wordpress_db_user \
            -target=railway_variable.wordpress_db_password \
            -target=railway_variable.wordpress_db_name \
            -target=railway_variable.wp_admin_user \
            -target=railway_variable.wp_admin_password \
            -target=railway_variable.wp_admin_email \
            -target=railway_variable.wp_title \
            -var="wp_admin_password=$PASSWORD"

      - name: Save Terraform state to branch
        if: >
          always() &&
          steps.gate.outputs.skip == 'false' &&
          steps.state.outputs.skip != 'true' &&
          (
            steps.prune.outputs.changed == 'true' ||
            (github.event_name == 'workflow_dispatch' && inputs.run_apply == 'yes')
          )
        working-directory: .
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          git worktree add -B "$TF_STATE_BRANCH" "$TMP" "origin/$TF_STATE_BRANCH" 2>/dev/null \
            || git worktree add -B "$TF_STATE_BRANCH" "$TMP"
          cp terraform/terraform.tfstate "$TMP/terraform.tfstate"
          if [ -f terraform/terraform.tfstate.backup ]; then
            cp terraform/terraform.tfstate.backup "$TMP/terraform.tfstate.backup"
          fi
          cd "$TMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terraform.tfstate terraform.tfstate.backup 2>/dev/null || git add terraform.tfstate
          if git diff --cached --quiet; then
            echo "State sem alteracoes."
          else
            git commit -m "chore(tfstate): prune stale Railway domain / apply infra"
            git push origin "HEAD:$TF_STATE_BRANCH"
          fi

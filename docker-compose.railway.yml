# Referencia local da stack de 2 servicos (espelha o que o GitHub Action sobe no Railway).
services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpapp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme-wpapp}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      PORT: "80"
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wpapp
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-changeme-wpapp}
      WORDPRESS_DB_NAME: wordpress

volumes:
  db_data:

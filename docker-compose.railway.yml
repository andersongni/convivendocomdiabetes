# Stack completa Railway: MySQL (importa dump no 1o boot) + WordPress.
# Tudo ligado por codigo — sem preencher variaveis manualmente no painel.

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpapp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme-wpapp}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme-root}
    volumes:
      - db_data:/var/lib/mysql
    command:
      - --max_allowed_packet=256M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      PORT: "80"
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wpapp
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-changeme-wpapp}
      WORDPRESS_DB_NAME: wordpress
      WP_HOME: ${WP_HOME:-}
      WP_SITEURL: ${WP_SITEURL:-}

volumes:
  db_data:

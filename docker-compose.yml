# Variaveis: apenas localhost via arquivo .env (ver .env.example).
# Railway nao usa este compose — ver .env.railway.example e .railway/railway.ts.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-convivend62e9f3c_ccd}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
      - ./dump-database.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
    ports:
      - "3306:3306"
    command: --max_allowed_packet=256M --innodb_buffer_pool_size=512M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db:3306}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-convivend62e9f3c_ccd}
      WP_HOME: ${WP_HOME:-http://localhost:8080}
      WP_SITEURL: ${WP_SITEURL:-http://localhost:8080}
      CCD_RECAPTCHA_SITE_KEY: ${CCD_RECAPTCHA_SITE_KEY:-}
      CCD_RECAPTCHA_SECRET_KEY: ${CCD_RECAPTCHA_SECRET_KEY:-}
      # 1 = re-copia plugins/themes do host no boot (ou use scripts/sync-local-wp-content.ps1)
      SYNC_WP_CONTENT: ${SYNC_WP_CONTENT:-0}
      HOST_WP_CONTENT: /host-wp-content
    entrypoint: ["bash", "/usr/local/bin/local-entrypoint.sh"]
    command: ["apache2-foreground"]
    volumes:
      - ./wordpress/wp-config.php:/var/www/html/wp-config.php:ro
      - ./wordpress/.htaccess:/var/www/html/.htaccess:ro
      - ./scripts/local-entrypoint.sh:/usr/local/bin/local-entrypoint.sh:ro
      - ./scripts/sync-wp-content.sh:/usr/local/bin/sync-wp-content.sh:ro
      - ./docker/opcache-local.ini:/usr/local/etc/php/conf.d/opcache-local.ini:ro
      - ./docker/apache-performance.conf:/etc/apache2/conf-available/performance.conf:ro
      # Host (lento no Windows) so para sync; PHP le do volume Linux abaixo
      - ./wordpress/wp-content:/host-wp-content:ro
      - wp_content:/var/www/html/wp-content
      # Uploads continuam no host (poucos PHP; midia grande)
      - ./wordpress/wp-content/uploads:/var/www/html/wp-content/uploads

volumes:
  db_data:
  wp_content:

# Liveness Railway: GET /ccdhealth → 200 text/plain, sem WP/DB/redirect.
Alias "/ccdhealth" "/var/www/html/wp-content/ccd-health-ok.txt"
<Location "/ccdhealth">
  Require all granted
  Header set Cache-Control "no-store"
  Header set Content-Type "text/plain; charset=UTF-8"
</Location>

# Readiness (blue/green): /ccdready → PHP que valida MySQL.
# Path sem ponto (Railway healthcheck so aceita [a-zA-Z0-9/_]).
# Canonico www → apex: a regra efetiva esta em wordpress/.htaccess (RewriteEngine
# do .htaccess sobrescreve conf global). Este bloco e fallback se AllowOverride
# estiver off ou .htaccess ausente.
# /ccdhealth, /ccdready e limpeza de cache nao redirecionam.
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteRule ^/?ccdready$ /ccdready.php [L]
  RewriteCond %{REQUEST_URI} !^/ccdhealth$ [NC]
  RewriteCond %{REQUEST_URI} !^/ccdready(?:\.php)?$ [NC]
  RewriteCond %{QUERY_STRING} !(^|&)action=ccd_clear_cache(&|$) [NC]
  RewriteCond %{HTTP_HOST} ^www\.convivendocomdiabetes\.com(?::\d+)?$ [NC]
  RewriteRule ^ https://convivendocomdiabetes.com%{REQUEST_URI} [R=301,L,QSA]
</IfModule>

# Erros HTTP amigaveis (PT) — fallback se .htaccess nao aplicar
ErrorDocument 403 /wp-content/ccd-http-error.php?code=403
ErrorDocument 404 /wp-content/ccd-http-error.php?code=404
ErrorDocument 500 /wp-content/ccd-http-error.php?code=500

# Cache de estáticos + compressão (Railway / Apache)
# HTML NÃO usa ExpiresDefault longo: inline JS (mu-plugins) ficava 1 semana
# no browser e o soft-nav antigo engolia cliques do menu (preventDefault).
<IfModule mod_expires.c>
  ExpiresActive On
  # HTML: sem ExpiresDefault (Cloudflare trata Expires passado como DYNAMIC).
  # Cache-Control vem do PHP/advanced-cache (s-maxage) + Cache Rules.
  ExpiresByType text/css "access plus 1 month"
  ExpiresByType application/javascript "access plus 1 month"
  ExpiresByType text/javascript "access plus 1 month"
  ExpiresByType image/jpeg "access plus 6 months"
  ExpiresByType image/png "access plus 6 months"
  ExpiresByType image/gif "access plus 6 months"
  ExpiresByType image/webp "access plus 6 months"
  ExpiresByType image/svg+xml "access plus 6 months"
  ExpiresByType image/x-icon "access plus 1 year"
  ExpiresByType font/woff2 "access plus 1 year"
  ExpiresByType font/woff "access plus 1 year"
  ExpiresByType application/font-woff2 "access plus 1 year"
</IfModule>

<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml image/svg+xml
</IfModule>

<IfModule mod_headers.c>
  <FilesMatch "\.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2)$">
    Header set Cache-Control "public, max-age=2592000, immutable"
  </FilesMatch>
  # HTML: browser revalida; s-maxage permite cache na borda (Cloudflare).
  Header set Cache-Control "public, max-age=0, s-maxage=3600, must-revalidate" "expr=%{CONTENT_TYPE} =~ m#^text/html#i"
  Header unset ETag
</IfModule>
FileETag None

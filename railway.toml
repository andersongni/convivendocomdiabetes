# Build/deploy do servico WordPress.
# Projeto/servicos/variaveis/dominio: terraform/ (provider comunitario Railway).
# Deploy do codigo: Auto-deploy GitHub -> Railway na branch main.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/wp-login.php"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
